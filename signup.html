<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up — The Edit Society</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Create your Edit Society account, pick a video pack and send your first footage today.">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./dash/dash.css">
<style>
.pane{justify-content:flex-start !important;padding-top:56px !important;padding-bottom:56px !important}
.su{display:flex;flex-direction:column;gap:22px;max-width:480px;width:100%}
.plist{display:flex;flex-direction:column;gap:10px}
.popt{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:14px;align-items:center;padding:18px 18px;border-radius:18px;border:1px solid #222226;background:linear-gradient(180deg,#161618,#0F0F10);cursor:pointer;text-align:left;transition:border-color .25s,transform .25s,box-shadow .3s}
.popt:hover{border-color:#4A4A50;transform:translateY(-1px)}
.popt.on{border-color:transparent;background:linear-gradient(#141416,#141416) padding-box,linear-gradient(100deg,#E0303B,#FF5A1F 55%,#F2A65A) border-box;box-shadow:0 0 0 3px #FF5A1F14,0 10px 30px #FF5A1F1F}
.popt .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid #4A4A50;display:grid;place-items:center;transition:border-color .25s}
.popt.on .rd{border-color:#FF5A1F}
.popt .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:#FF5A1F;transform:scale(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.popt.on .rd::after{transform:scale(1)}
.popt b{display:block;font:600 17px/1.2 'Inter Tight',sans-serif;letter-spacing:-.02em}
.popt small{display:block;font-size:13px;color:#8C8A86;margin-top:3px}
.popt .pp{text-align:right;font:500 18px/1.1 'Inter Tight',sans-serif;white-space:nowrap}
.popt .pp span{display:block;font:400 12px Inter,sans-serif;color:#6E6C68;margin-top:2px}
.popt .tag{position:absolute;right:14px;top:-10px;padding:2px 9px;border-radius:999px;background:#F2F0EC;color:#0B0B0C;font-size:11px;font-weight:600}
.packs{display:flex;padding:4px;border-radius:999px;border:1px solid #222226;background:#111113;width:max-content;max-width:100%}
.packs button{min-height:38px;padding:0 14px;border-radius:999px;border:0;background:none;color:#8C8A86;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .25s}
.packs button.on{background:#F2F0EC;color:#0B0B0C}
.packs.off{opacity:.35;pointer-events:none}
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:#6E6C68}
.steps i{width:24px;height:24px;border-radius:50%;border:1px solid #2C2C31;display:inline-grid;place-items:center;font-style:normal;font-size:11px;margin-right:6px}
.steps .on{color:#F2F0EC}.steps .on i{background:#F2F0EC;color:#0B0B0C;border-color:#F2F0EC}
.steps .done i{background:#FF5A1F;color:#0B0B0C;border-color:#FF5A1F}
.steps .ln{width:24px;height:1px;background:#2C2C31}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid #2C2C31;background:#0F0F10;font-size:13px;color:#C9C7C2}
.note svg{flex-shrink:0;color:#FF5A1F;margin-top:1px}
.pwwrap{position:relative}.pwwrap .in{padding-right:64px}
.pwwrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8C8A86;font-size:12px;cursor:pointer;padding:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#8C8A86;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#FF5A1F;margin:1px 0 0;flex-shrink:0}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1px solid #1E1E21;font-size:13px;color:#8C8A86}
.sum b{color:#F2F0EC;font-weight:500}
.fade{animation:fadeup .45s cubic-bezier(.2,.8,.2,1) both}
.mlogo{display:none}@media (max-width:900px){.mlogo{display:block;font-size:20px}.pane{padding-top:28px !important}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="auth">
  <div class="art">
    <video data-bg src="./assets/work/long2.mp4" poster="./assets/work/long2.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="in">
      <a class="logo" href="index.html" style="padding:0"><span class="sans" style="font-weight:600">the</span><span class="serif"> edit </span><span class="sans" style="font-weight:600">society</span></a>
      <div style="display:flex;flex-direction:column;gap:18px">
        <span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#D9D7D2">Join the Society</span>
        <h2 class="disp">Your first edit,<br><span class="serif" style="font-size:1.08em">this week</span></h2>
        <p style="margin:0;max-width:420px;color:#D9D7D2">Pick a pack, send your footage and get your first cut in 48–72 hours. Human editors, flat price per video.</p>
      </div>
    </div>
  </div>
  <div class="pane">
    <a class="logo mlogo" href="index.html" style="padding:0"><span class="sans" style="font-weight:600">the</span><span class="serif"> edit </span><span class="sans" style="font-weight:600">society</span></a>
    <div class="su" id="su"></div>
    <p class="dim" style="font-size:13px;margin:0">Already a member? <a class="link" href="login.html">Log in</a></p>
  </div>
</div>
<script src="./site-data.js"></script>
<script type="module">
import { getApi, DEMO } from './dash/api.js';
import { esc, autoplay } from './dash/ui.js';
autoplay();
const api = await getApi('customer');
const P = (window.TES && window.TES.pricing) || { simple: { 4: 2499, 8: 2299, 12: 2099 }, complex: { 4: 3999, 8: 3699, 12: 3399 }, premiumFrom: 24999, save: {} };
const inr = (n) => '₹[' + n.toLocaleString('en-IN') + ']';
const q = new URLSearchParams(location.search);
const st = { plan: ['simple', 'complex', 'premium'].includes(q.get('plan')) ? q.get('plan') : 'complex', pack: [4, 8, 12].includes(+q.get('pack')) ? +q.get('pack') : 8, step: 1,
  full_name: '', company: '', email: '', phone: '', password: '' };
const box = document.getElementById('su');
const CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>';
const ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

// If someone is already logged in, signing up here simply creates the new account and switches to it.

const PLANS = [
  { k: 'simple', name: 'Simple', d: 'Clean, punchy social reels' },
  { k: 'complex', name: 'Complex', d: 'Talking-head & retention edits', tag: 'Most popular' },
  { k: 'premium', name: 'Premium', d: 'Launches & campaigns · 12 videos' }
];
const price = (k) => k === 'premium' ? inr(P.premiumFrom) : inr(P[k][st.pack]);
const unit = (k) => k === 'premium' ? 'from / campaign' : 'per video';
const packLabel = () => st.plan === 'premium' ? 'Premium · 12 videos' : `${st.plan[0].toUpperCase() + st.plan.slice(1)} · ${st.pack}-pack`;
const stepper = () => `<div class="steps"><span class="${st.step === 1 ? 'on' : 'done'}"><i>${st.step > 1 ? '✓' : '1'}</i>Choose plan</span><span class="ln"></span><span class="${st.step === 2 ? 'on' : ''}"><i>2</i>Your details</span></div>`;

function draw() {
  if (st.step === 1) {
    box.innerHTML = `${stepper()}
      <div class="fade"><h1>Pick your <span class="serif">pack</span></h1><p class="muted" style="margin:10px 0 0">Flat price per video. Bigger packs cost less per video.</p></div>
      <div class="packs fade ${st.plan === 'premium' ? 'off' : ''}" role="tablist" aria-label="Pack size">${[4, 8, 12].map((n) => `<button type="button" data-n="${n}" class="${st.pack === n ? 'on' : ''}">${n}-pack${P.save && P.save[n] ? ' · ' + P.save[n] : ''}</button>`).join('')}</div>
      <div class="plist fade" role="radiogroup" aria-label="Plan">${PLANS.map((p) => `<button type="button" role="radio" aria-checked="${st.plan === p.k}" class="popt ${st.plan === p.k ? 'on' : ''}" data-p="${p.k}">${p.tag ? `<span class="tag">${p.tag}</span>` : ''}<span class="rd"></span><span><b>${p.name}</b><small>${p.d}</small></span><span class="pp">${price(p.k)}<span>${unit(p.k)}</span></span></button>`).join('')}</div>
      <div class="sum fade"><span>Selected</span><b>${packLabel()}${st.plan === 'premium' ? '' : ' · ' + inr(P[st.plan][st.pack] * st.pack) + ' total'}</b></div>
      <div class="note fade">${CHECK}<span><b style="color:#F2F0EC">No payment needed today.</b> Your plan starts as soon as you sign up — we’ll send your invoice on WhatsApp/email after your first request.</span></div>
      <button class="btn" id="next" type="button">Continue ${ARROW}</button>
      <a class="link" href="pricing.html#compare" style="font-size:13px">Compare all plans</a>`;
    box.querySelectorAll('.popt').forEach((b) => b.addEventListener('click', () => { st.plan = b.dataset.p; draw(); }));
    box.querySelectorAll('.packs button').forEach((b) => b.addEventListener('click', () => { st.pack = +b.dataset.n; draw(); }));
    document.getElementById('next').addEventListener('click', () => { st.step = 2; draw(); });
    return;
  }
  box.innerHTML = `${stepper()}
    <div class="fade"><h1>Create your <span class="serif">account</span></h1><p class="muted" style="margin:10px 0 0">${esc(packLabel())} · <button type="button" class="link" id="change" style="font-size:inherit">change</button></p></div>
    <form id="f" class="fade" novalidate style="display:flex;flex-direction:column;gap:16px">
      <div id="msg"></div>
      <div class="fgrid">
        <div class="field"><label for="n">Full name *</label><input class="in" id="n" autocomplete="name" required value="${esc(st.full_name)}" placeholder="Your name"></div>
        <div class="field"><label for="c">Brand / channel</label><input class="in" id="c" autocomplete="organization" value="${esc(st.company)}" placeholder="Optional"></div>
      </div>
      <div class="field"><label for="e">Email *</label><input class="in" id="e" type="email" autocomplete="email" required value="${esc(st.email)}" placeholder="you@brand.com"></div>
      <div class="field"><label for="ph">WhatsApp number</label><input class="in" id="ph" type="tel" autocomplete="tel" value="${esc(st.phone)}" placeholder="+91 …"><small>We’ll send draft-ready updates here.</small></div>
      <div class="field"><label for="pw">Password *</label><div class="pwwrap"><input class="in" id="pw" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><button type="button" id="eye">Show</button></div></div>
      <label class="chk"><input type="checkbox" id="ok"><span>I agree to the Terms and Privacy Policy, and understand my plan is billed by invoice.</span></label>
      <button class="btn accent" type="submit" id="go">Create account &amp; start plan ${ARROW}</button>
    </form>`;
  document.getElementById('change').addEventListener('click', () => { save(); st.step = 1; draw(); });
  document.getElementById('eye').addEventListener('click', (e) => { const i = document.getElementById('pw'); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; e.target.textContent = show ? 'Hide' : 'Show'; });
  document.getElementById('f').addEventListener('submit', submit);
}
function save() {
  const v = (id) => (document.getElementById(id) || {}).value || '';
  Object.assign(st, { full_name: v('n').trim(), company: v('c').trim(), email: v('e').trim(), phone: v('ph').trim(), password: v('pw') });
}
const show = (html, ok) => { document.getElementById('msg').innerHTML = html ? `<div class="${ok ? 'ok' : 'err'}">${html}</div>` : ''; };
async function submit(e) {
  e.preventDefault(); save();
  if (!st.full_name) return show('Please enter your name.');
  if (!/^\S+@\S+\.\S+$/.test(st.email)) return show('Please enter a valid email.');
  if (st.password.length < 8) return show('Use a password with at least 8 characters.');
  if (!document.getElementById('ok').checked) return show('Please accept the terms to continue.');
  const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Creating your account…';
  try {
    const pack = st.plan === 'premium' ? 12 : st.pack;
    const r = await api.signUp({ email: st.email, password: st.password, meta: { full_name: st.full_name, company: st.company, phone: st.phone, plan: st.plan, pack } });
    if (r.session) { location.replace('dashboard.html?welcome=1' + (DEMO ? '&demo' : '')); return; }
    box.innerHTML = `<div class="fade" style="display:flex;flex-direction:column;gap:18px">
      <h1>Check your <span class="serif">inbox</span></h1>
      <p class="muted" style="margin:0">We sent a confirmation link to <b style="color:#F2F0EC">${esc(st.email)}</b>. Click it and you’ll land straight in your dashboard with your <b style="color:#F2F0EC">${esc(packLabel())}</b> plan ready.</p>
      <div class="note">${CHECK}<span>Can’t find it? Check spam or promotions, or <a class="link" href="index.html#book">contact the studio</a>.</span></div>
      <a class="btn ghost" href="login.html">Go to login</a></div>`;
  } catch (err) {
    show(esc(err.message) + (/exists/.test(err.message) ? ' <a class="link" href="login.html">Log in</a>' : ''));
    btn.disabled = false; btn.innerHTML = 'Create account &amp; start plan ' + ARROW;
  }
}
draw();
</script>
</body>
</html>
